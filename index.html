<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil & Minat IT - Muh. Isa Madani</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
            padding: 30px;
        }

        .card h2 {
            text-align: center;
            color: #1a5276;
            margin-bottom: 20px;
            border-bottom: 2px solid #e1e8ed;
            padding-bottom: 10px;
        }

        .info-group {
            margin-bottom: 15px;
        }

        .info-group label {
            font-weight: bold;
            color: #555;
            display: block;
            margin-bottom: 5px;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-group p {
            background-color: #f8f9fa;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
            color: #2d3748;
            font-weight: 500;
        }

        .interest-section {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 2px dashed #e1e8ed;
        }

        .interest-section label {
            font-weight: bold;
            color: #1a5276;
            display: block;
            margin-bottom: 10px;
        }

        select, input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            outline: none;
            font-size: 1rem;
            margin-bottom: 15px;
            transition: border-color 0.2s;
        }

        select:focus, input[type="text"]:focus {
            border-color: #3182ce;
        }

        button {
            width: 100%;
            background-color: #2b6cb0;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #2c5282;
        }

        .result-message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            background-color: #ebf8ff;
            color: #2b6cb0;
            text-align: center;
            display: none;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Profil Mahasiswa</h2>

        <div class="info-group">
            <label>Nama Mahasiswa</label>
            <p>Muh. Isa Madani</p>
        </div>

        <div class="info-group">
            <label>NIM</label>
            <p>2505090002</p>
        </div>

        <div class="info-group">
            <label>Program Studi</label>
            <p>Pendidikan Teknik Informatika dan Komputer</p>
        </div>

        <form id="itForm" class="interest-section" onsubmit="handleSubmit(event)">
            <label for="bidangIT">Bidang IT yang Ingin Diketahui:</label>
            <select id="bidangIT" required>
                <option value="" disabled selected>-- Pilih Bidang IT --</option>
                <option value="Web Development & Software Engineering">Web Development & Software Engineering</option>
                <option value="Computer Network & Cybersecurity">Computer Network & Cybersecurity</option>
                <option value="Artificial Intelligence & Data Science">Artificial Intelligence & Data Science</option>
                <option value="Mobile App Development">Mobile App Development</option>
                <option value="Cloud Computing & DevOps">Cloud Computing & DevOps</option>
            </select>

            <button type="submit">Simpan Pilihan</button>
        </form>

        <div id="resultMessage" class="result-message"></div>
    </div>

    <script>
        function handleSubmit(event) {
            event.preventDefault();
            const selectedField = document.getElementById('bidangIT').value;
            const resultDiv = document.getElementById('resultMessage');

            resultDiv.style.display = 'block';
            resultDiv.innerHTML = `Pilihan Anda berhasil disimpan: <strong>${selectedField}</strong>`;
        }
    </script>

</body>
</html>
